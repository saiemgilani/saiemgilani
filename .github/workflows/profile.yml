# Regenerates the profile README's cards as static SVGs on the `output` branch and
# refreshes the "Latest notes" list from saiemgilani.com.
#
# Static files instead of hot-linked Vercel instances: two of the old README's cards
# (profile trophies, activity graph) died when their free hosting lapsed (HTTP 402),
# and github-readme-stats now recommends this Action over its public instance.
name: profile

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml"]
  # a PR that changes this file regenerates the cards so the PR can be previewed
  pull_request:
    paths: [".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=github_dark
          path: dist/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=default
          path: dist/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide=html,css,tsql&hide_border=true&theme=github_dark
          path: dist/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide=html,css,tsql&hide_border=true&theme=default
          path: dist/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Collect the 3D calendars
        run: |
          cp profile-3d-contrib/profile-night-rainbow.svg dist/3d-dark.svg
          cp profile-3d-contrib/profile-season.svg dist/3d-light.svg

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "chore: regenerate profile cards"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notes:
    # edits README.md on main, so never from a pull request
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.saiemgilani.com/feed.xml"
          max_post_count: 5
          commit_message: "docs: refresh latest notes from saiemgilani.com"

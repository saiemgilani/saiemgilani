# Regenerates the profile README's cards as static SVGs on the `output` branch and
# refreshes the "Latest notes" list from saiemgilani.com.
#
# Static files instead of hot-linked Vercel instances: two of the old README's cards
# (profile trophies, activity graph) died when their free hosting lapsed (HTTP 402),
# and github-readme-stats now recommends this Action over its public instance.
# The default GITHUB_TOKEN is enough: the 3D calendar's count matches the profile's
# own contribution calendar (private contributions follow the profile setting).
name: profile

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml"]
  # a PR that changes this file builds every card but publishes nothing
  pull_request:
    paths: [".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

env:
  # hide=stars: the card counts stars on repos this account owns (~160), not the
  # SportsDataverse org repos it maintains; the README's star badge has the real total
  STATS_OPTIONS: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&hide=stars
  LANGS_OPTIONS: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide=html,css,tsql&hide_border=true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # fail_on_error: a failed card stops the run, so yesterday's cards stay up
      # instead of being replaced by an error card.
      # Every card uses the monokai theme (a dark card on both light and dark pages),
      # so one file per card replaces the old light/dark pairs.
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: ${{ env.STATS_OPTIONS }}&theme=monokai
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Top languages
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: ${{ env.LANGS_OPTIONS }}&theme=monokai
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # snk has no monokai preset: monokai pink snake, monokai-green ramp on the
          # theme's line-highlight grey (#3e3d32) for empty days
          outputs: |
            dist/snake.svg?color_snake=#f92672&color_dots=#3e3d32,#4b5a20,#6d8b24,#8fb828,#a6e22e

      - name: Collect the 3D calendar
        run: |
          cp profile-3d-contrib/profile-gitblock.svg dist/3d.svg
          ls -l dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "chore: regenerate profile cards"
          # PR runs prove the cards build; only main publishes them
          dry_run: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notes:
    # edits README.md on main, so never from a pull request
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://www.saiemgilani.com/feed.xml"
          max_post_count: 5
          commit_message: "docs: refresh latest notes from saiemgilani.com"
